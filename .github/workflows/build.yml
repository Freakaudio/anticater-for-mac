name: Build Spanish DMG
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: |
          swift build -c release
          ./make-app.sh release
          echo "HOME=$HOME"
          ls -la "$HOME/outputs" || true
      - name: Make DMG
        run: |
          APP="$HOME/outputs/ANTICATER 原生版.app"
          echo "APP=$APP"
          test -d "$APP" || { echo "App not found in $HOME/outputs"; ls -la "$HOME/outputs"; exit 1; }
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Aplicaciones"
          hdiutil create -volname "ANTICATER ES" -srcfolder "$STAGE" -ov -format UDZO "$GITHUB_WORKSPACE/ANTICATER-ES.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ANTICATER-ES-dmg
          path: ANTICATER-ES.dmg
