name: Build Spanish DMG
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: |
          swift build -c release
          ./make-app.sh release
          # make-app.sh writes outputs three levels above the repo; locate it
          find /home/runner -maxdepth 4 -name "ANTICATER *.app" -type d 2>/dev/null || true
          ls -la outputs 2>/dev/null || true
      - name: Make DMG
        run: |
          APP=$(find /home/runner -maxdepth 4 -name "ANTICATER *.app" -type d 2>/dev/null | head -1)
          echo "APP=$APP"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Aplicaciones"
          hdiutil create -volname "ANTICATER ES" -srcfolder "$STAGE" -ov -format UDZO "$GITHUB_WORKSPACE/ANTICATER-ES.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ANTICATER-ES-dmg
          path: ANTICATER-ES.dmg
